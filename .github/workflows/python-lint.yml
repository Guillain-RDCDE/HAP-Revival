name: Lint Python tools

on:
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python-lint.yml"
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python-lint.yml"
  workflow_dispatch:
  # "Release HAP Sync" runs this whole file first and builds nothing unless
  # every job here passes.
  workflow_call:

permissions:
  contents: read

concurrency:
  # A literal prefix, not github.workflow: when release.yml calls this file,
  # github.workflow is the caller's name and the two groups would collide.
  group: python-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        # Pinned deliberately: unpinned, every ruff release enables new default
        # rules and turns this gate red on code nobody touched. 0.16.5 did
        # exactly that on 2026-08-23 (79 findings, none of them new code).
        # Bump on purpose, with the cleanup in the same commit, and keep
        # .pre-commit-config.yaml on the same version.
        run: pip install ruff==0.16.10
      - name: Run ruff
        # Rules and exclusions live in pyproject.toml.
        run: ruff check tools/ tests/
      - name: Check formatting
        run: ruff format --check tools/ tests/

  syntax-check:
    name: Python syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile all tools
        run: python -m compileall -q tools/

  tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pytest
        run: pip install pytest==9.1.1 pytest-cov==7.1.0
      - name: Run the test suite
        # Stdlib + pytest only — pure-logic + a loopback mock device. No HAP needed.
        # The tkinter GUI tests skip themselves here; the job below runs them.
        run: python -m pytest tests/ --cov=tools --cov-report=term-missing:skip-covered

  tests-windows:
    name: pytest (Windows)
    # HapSync.exe ships for Windows: the suite runs where the users are,
    # GUI tests included (a Windows runner has a desktop).
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pytest
        run: pip install pytest==9.1.1
      - name: Run the test suite
        run: python -m pytest tests/

  gui-tests:
    name: pytest (tkinter GUI under Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pytest and a virtual display
        run: |
          pip install pytest==9.1.1
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb
      - name: Drive HAP Sync's window headlessly
        # Builds the real App, hides it, and calls every handler with the engine faked.
        run: xvfb-run -a python -m pytest tests/test_hap_gui_fix.py tests/test_hap_gui_app.py
