name: Lint docs and links

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - "tools/check_links.py"
      - ".github/workflows/docs-lint.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - "tools/check_links.py"
      - ".github/workflows/docs-lint.yml"

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            **/*.md
            !**/node_modules/**

  anchors:
    name: Relative links and anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check every relative link and heading anchor
        # markdownlint and lychee both ignore #fragments, so a link to a heading
        # that no longer exists passes them. Two such links were dead for two
        # weeks before anyone noticed. Stdlib only; external URLs not checked.
        run: python tools/check_links.py

  linkcheck:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Link checker
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress --exclude-mail './**/*.md'
          fail: false   # link-check failures shouldn't block PRs — external sites die
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
