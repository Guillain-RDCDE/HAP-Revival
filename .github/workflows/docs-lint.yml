name: Lint docs and links

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - "tools/check_links.py"
      - ".github/workflows/docs-lint.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - "tools/check_links.py"
      - ".github/workflows/docs-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Run markdownlint-cli2
        # Rules and ignores live in .markdownlint-cli2.jsonc.
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !**/node_modules/**

  anchors:
    name: Relative links and anchors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check every relative link and heading anchor
        # markdownlint and lychee both ignore #fragments, so a link to a heading
        # that no longer exists passes them. Two such links were dead for two
        # weeks before anyone noticed. Stdlib only; external URLs not checked.
        run: python tools/check_links.py

  linkcheck:
    name: Check links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Link checker
        uses: lycheeverse/lychee-action@v2
        with:
          # Mail addresses are not checked by default since lychee 0.15.
          args: --no-progress './**/*.md'
          fail: false   # link-check failures shouldn't block PRs — external sites die
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
