name: Release HAP Sync

# Builds HapSync.exe on Windows, checks that the tag says what
# tools/hap_update.VERSION says (every tool reports that number and the
# update check compares against it), and opens a *draft* GitHub release with
# the exe and its SHA-256 attached. Publishing the draft, after writing the
# notes, is a human's click: from that moment every installed copy sees the
# new version.
#
# Two ways in: push a tag `hap-sync-vX.Y.Z`, or run it from the Actions tab
# on the commit to release, in which case the workflow creates that tag
# itself from VERSION (and refuses if it already exists).

on:
  push:
    tags:
      - "hap-sync-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build HapSync.exe and draft the release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: The tag and tools/hap_update.VERSION must agree
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'tools'); import hap_update; print(hap_update.VERSION)"
          $tag = "hap-sync-v$version"
          Write-Host "tools/hap_update.VERSION $version -> $tag (event: ${{ github.event_name }})"
          if ("${{ github.event_name }}" -eq "push") {
            if ("${{ github.ref_name }}" -ne $tag) {
              throw "tag ${{ github.ref_name }} does not match tools/hap_update.VERSION ($version): bump VERSION (and the CHANGELOG) before tagging"
            }
          } else {
            git fetch --tags --quiet origin
            if (git tag --list $tag) {
              throw "$tag already exists: bump tools/hap_update.VERSION (and the CHANGELOG) before releasing again"
            }
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "HAP Sync $tag"
            git push origin $tag
            Write-Host "created $tag at ${{ github.sha }}"
          }
          "TAG=$tag" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "VERSION=$version" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Build the exe
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/build_gui.ps1

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\HapSync.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  HapSync.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
          "SHA256=$hash" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: The exe reports the tagged version
        shell: pwsh
        run: |
          $size = (Get-Item dist\HapSync.exe).Length
          Write-Host "HapSync.exe: $size bytes"
          if ($size -lt 5MB) { throw "HapSync.exe is suspiciously small ($size bytes)" }

      - name: Draft the release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ env.TAG }}
          name: HAP Sync v${{ env.VERSION }}
          generate_release_notes: true
          body: |
            **Download `HapSync.exe` below.** No install, no Python, no admin rights — double-click it.
            Copies already installed offer this version themselves: HAP Sync in its footer, the web
            remote in a banner, the command-line tools at the end of a run.

            **Verify your download** — SHA-256 of `HapSync.exe`:

            ```text
            ${{ env.SHA256 }}
            ```

            Windows x64 · built by CI from the sources at this tag · nothing here can damage your device.
          files: |
            dist/HapSync.exe
            dist/SHA256SUMS.txt
